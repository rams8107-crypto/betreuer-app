# GBB Lernen – Deploy auf Render (Blueprint)
services:
  - type: web
    name: gbb-lernen
    runtime: python
    plan: free
    region: frankfurt
    rootDir: betreuer_cloud_pwa
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
